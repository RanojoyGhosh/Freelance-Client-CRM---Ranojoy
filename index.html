a{color:inherit;text-decoration:none}
::selection{background:var(--brand-soft)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
.num{font-family:var(--mono);font-feature-settings:"tnum";letter-spacing:-.01em}
.grad-text{color:var(--brand)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:12px 10px;display:flex;flex-direction:column;gap:2px;background:var(--surface2);border-right:1px solid var(--line);z-index:5}
.ws{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer;transition:background .15s}
.ws:hover{background:var(--bg2)}
.ws img{width:30px;height:30px;border-radius:8px;object-fit:cover;filter:grayscale(1) contrast(1.05);box-shadow:0 0 0 1px var(--line2)}
.ws b{display:block;font-size:13.5px;font-weight:600;line-height:1.2}
.ws small{display:block;color:var(--muted);font-size:11.5px;line-height:1.2}
.ws .chev{margin-left:auto;color:var(--faint);font-size:11px}
.side-search{display:flex;align-items:center;gap:8px;margin:8px 2px 6px;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;font-size:13px;transition:border-color .15s}
.side-search:hover{border-color:var(--line2)}
.side-search svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.side-search .kbd{margin-left:auto}
.nav-label{font-size:11px;color:var(--faint);padding:14px 10px 4px;font-weight:500}
.nav a{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:7px;color:var(--ink2);font-weight:450;transition:background .12s,color .12s}
.nav a svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;color:var(--muted)}
.nav a:hover{background:var(--bg2)}
.nav a.on{background:var(--surface);color:var(--ink);font-weight:550;box-shadow:var(--shadow),0 0 0 1px var(--line)}
.nav a.on svg{color:var(--brand)}
.nav a .count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.nav a .count.alert{color:#fff;background:var(--red);border-radius:5px;padding:0 6px;line-height:18px}
.side-foot{margin-top:auto;padding:10px;border-top:1px solid var(--line);font-size:12px;display:flex;align-items:center;gap:8px}
.side-foot .sp{margin-left:auto;display:flex;gap:4px}
.sync{display:flex;align-items:center;gap:7px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--brand)}.dot.demo{background:var(--gold)}.dot.err{background:var(--red)}.dot.busy{background:var(--brand-2);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;height:52px;display:flex;align-items:center;gap:12px;padding:0 28px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.crumb b{color:var(--ink);font-weight:550}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.me-btn{width:30px;height:30px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px var(--line2);cursor:pointer;flex:none}
.me-btn img{width:100%;height:100%;object-fit:cover;filter:grayscale(1)}
.content{padding:24px 28px 80px;max-width:1440px;width:100%}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.top h1{font-size:22px;font-weight:650;letter-spacing:-.02em;line-height:1.2}
.top h1 em{font-style:normal;color:inherit}
.top p{color:var(--muted);margin-top:4px;font-size:13px}
.eyebrow{display:none}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--surface);font-weight:550;font-size:13px;cursor:pointer;box-shadow:var(--shadow);transition:background .12s,border-color .12s,color .12s;white-space:nowrap}
.btn:hover{background:var(--surface2);border-color:var(--faint)}
.btn:active{transform:translateY(.5px)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),var(--shadow)}
.btn.primary:hover{background:var(--brand-ink)}
[data-theme="dark"] .btn.primary{color:#0D110F}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--bg2)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn.sm.icon{width:28px}
.btn.danger{color:var(--red)}
.search{position:relative}
.search input{height:32px;width:240px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--surface);padding:0 10px 0 32px;outline:none;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.search svg{position:absolute;left:10px;top:9px;width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2}
.kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line2);border-radius:4px;padding:0 4px;color:var(--muted);background:var(--surface)}
.banner{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r);background:var(--gold-soft);color:var(--ink2);margin-bottom:18px;border:1px solid color-mix(in srgb,var(--gold) 25%,transparent);font-size:13px}
.banner b{color:var(--ink);font-weight:600}
.banner .btn{margin-left:auto}

/* ---------- views ---------- */
.view{animation:viewIn .25s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.stagger>*{animation:none}

/* ---------- cards ---------- */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.g2e{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.card h3{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h3 .sub{color:var(--muted);font-weight:400;margin-left:auto;font-size:12.5px}
.card h3 .sub a{color:var(--brand);font-weight:500}
.card.flush{padding:0}
.card.flush>h3{padding:14px 18px 0}
.strip{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px}
.strip .kpi{padding:16px 18px;border-left:1px solid var(--line);position:relative;min-width:0}
.strip .kpi:first-child{border-left:0}
.strip .card{border:0;border-left:1px solid var(--line);border-radius:0;box-shadow:none;background:transparent}
.strip .card:first-child{border-left:0}
.kpi .label{color:var(--muted);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .label i{display:none}
.kpi .val{font-size:26px;font-weight:650;letter-spacing:-.03em;margin-top:6px;line-height:1.1;font-feature-settings:"tnum"}
.kpi .foot{font-size:12px;color:var(--muted);margin-top:4px}
.kpi .foot b{font-weight:600;color:var(--ink2)}
.kpi .spark{position:absolute;right:16px;bottom:16px;width:78px;height:28px}
.kpis .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.up{color:var(--brand)!important}.down{color:var(--red)!important}
.section-title{font-size:15px;font-weight:650;margin:28px 0 12px;display:flex;align-items:baseline;gap:10px;letter-spacing:-.01em}
.section-title small{font-size:12.5px;color:var(--muted);font-weight:400}
.section-title small a{color:var(--brand)}
.chart-box{position:relative;height:230px}

/* profile */
.profile{display:flex;flex-direction:column;gap:14px}
.profile .pf-top{display:flex;gap:14px;align-items:center}
.profile img{width:64px;height:64px;border-radius:12px;object-fit:cover;filter:grayscale(1) contrast(1.05);box-shadow:0 0 0 1px var(--line2)}
.profile .nm{font-size:16px;font-weight:650;letter-spacing:-.01em}
.profile .rl{color:var(--muted);font-size:12.5px}
.profile .status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--brand);font-weight:550;margin-top:4px}
.profile .status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.profile dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px;border-top:1px solid var(--line);padding-top:12px}
.profile dt{color:var(--muted)}
.profile dd{text-align:right;font-family:var(--mono);font-size:12.5px}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:2px}
.fn{display:grid;grid-template-columns:120px 1fr 44px 84px;align-items:center;gap:12px;padding:7px 6px;border-radius:7px;cursor:pointer;transition:background .12s}
.fn:hover{background:var(--surface2)}
.fn .nm{font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}
.fn .nm i{width:8px;height:8px;border-radius:2px;flex:none}
.fn .track{height:8px;background:var(--bg2);border-radius:3px;overflow:hidden}
.fn .track i{display:block;height:100%;border-radius:3px;background:var(--brand);transition:width .6s var(--ease)}
.fn .c{font-family:var(--mono);text-align:right;font-size:12.5px}
.fn .v{font-family:var(--mono);text-align:right;font-size:12.5px;color:var(--muted)}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:8px 6px;border-top:1px solid var(--line);cursor:pointer;transition:background .12s;border-radius:6px}
.li:first-child{border-top:0}
.li:hover{background:var(--surface2)}
.li .t{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .grow{flex:1;min-width:0}
.avatar{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-weight:600;font-size:11px;flex:none;letter-spacing:.02em;border:1px solid var(--line)}
.avatar.lg{width:44px;height:44px;border-radius:10px;font-size:15px}
.empty{color:var(--muted);text-align:center;padding:22px 10px;font-size:12.5px}
.empty .serif{font-size:13.5px;font-weight:600;color:var(--ink2);display:block;margin-bottom:2px}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 7px;border-radius:5px;font-size:11.5px;font-weight:550;white-space:nowrap;background:var(--bg2);color:var(--ink2);border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;border-radius:2px;background:currentColor}
.pill.plain::before{display:none}
.p-gold{background:var(--gold-soft);color:var(--gold)}.p-green{background:var(--green-soft);color:var(--green)}.p-red{background:var(--red-soft);color:var(--red)}.p-amber{background:var(--amber-soft);color:var(--amber)}.p-blue{background:var(--blue-soft);color:var(--blue)}.p-violet{background:var(--violet-soft);color:var(--violet)}.p-grey{background:var(--bg2);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;padding:2px 7px;border-radius:5px;background:var(--bg2);color:var(--ink2);border:1px solid var(--line)}

/* ---------- table ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg button{border:0;background:transparent;height:26px;padding:0 10px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:550;font-size:12.5px;white-space:nowrap;transition:all .12s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow),0 0 0 1px var(--line)}
.seg button .c{font-family:var(--mono);font-size:11px;margin-left:5px;color:var(--faint)}
.table-wrap{overflow:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--surface2);position:sticky;top:0;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--ink)}
th.r,td.r{text-align:right}
td{padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--brand-tint)}
td .t{font-weight:550}
td .s{color:var(--muted);font-size:12px}

/* ---------- pipeline ---------- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px}
.col{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:8px;min-height:240px;transition:background .15s,box-shadow .15s}
.col.drop{background:var(--brand-tint);box-shadow:inset 0 0 0 1.5px var(--brand)}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 4px 10px;font-weight:600;font-size:12.5px}
.col-h .num{margin-left:auto;color:var(--muted);font-size:11.5px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;margin-bottom:6px;cursor:grab;box-shadow:var(--shadow);transition:border-color .12s,box-shadow .12s,opacity .12s}
.kcard:hover{border-color:var(--line2);box-shadow:var(--shadow-md)}
.kcard.dragging{opacity:.45}
.kcard .t{font-weight:600;margin-bottom:2px}
.kcard .s{color:var(--muted);font-size:12px;margin-bottom:8px}
.kcard .row{display:flex;align-items:center;gap:6px;justify-content:space-between}

/* ---------- team ---------- */
.members{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.member{cursor:pointer;transition:border-color .12s,box-shadow .12s}
.member:hover{border-color:var(--line2);box-shadow:var(--shadow-md)}
.member .cover{display:none}
.member .head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.member .name{font-size:14.5px;font-weight:650}
.member .role{color:var(--muted);font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:12px -18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{padding:10px 18px;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0}
.stats b{display:block;font-size:16px;font-weight:650;font-feature-settings:"tnum"}
.stats span{font-size:11.5px;color:var(--muted)}
.links{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.stars{color:var(--brand);letter-spacing:1px;font-size:12px}
.bar{height:6px;border-radius:3px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--brand)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:50;transform:translateX(102%);transition:transform .3s var(--ease);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-h{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dr-h h2{font-size:18px;font-weight:650;letter-spacing:-.015em;line-height:1.25}
.dr-h p{color:var(--muted);font-size:12.5px;margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dr-h .x{margin-left:auto}
.dr-b{flex:1;overflow:auto;padding:4px 22px 24px;overscroll-behavior:contain}
.dr-f{padding:12px 22px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:var(--surface2)}
.dr-f .grow{flex:1}
.fgroup{margin-top:20px}
.fgroup>h4{font-size:12px;color:var(--ink);font-weight:600;margin-bottom:10px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f label{font-size:12px;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea{width:100%;height:34px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--surface);padding:0 10px;outline:none;box-shadow:var(--shadow);transition:border-color .12s,box-shadow .12s}
.f textarea{height:auto;min-height:76px;padding:8px 10px;resize:vertical;line-height:1.5}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.f .ro{height:34px;display:flex;align-items:center;padding:0 10px;border-radius:var(--r-sm);background:var(--bg2);color:var(--ink2);font-family:var(--mono);font-size:12.5px}
.f.changed input,.f.changed select,.f.changed textarea{border-color:var(--brand-2);background:var(--brand-tint)}
.calc{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.calc div{padding:10px 12px;border-left:1px solid var(--line);background:var(--surface2)}
.calc div:first-child{border-left:0}
.calc div:nth-child(4){border-left:0}
.calc div:nth-child(n+4){border-top:1px solid var(--line)}
.calc span{font-size:11.5px;color:var(--muted)}
.calc b{display:block;font-size:16px;font-weight:650;font-feature-settings:"tnum";margin-top:1px}
.tabs-in{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 -22px;padding:0 22px;position:sticky;top:-4px;background:var(--surface);z-index:2}
.tabs-in button{border:0;background:none;padding:10px 2px;margin-right:16px;color:var(--muted);font-weight:550;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs-in button.on{color:var(--ink);border-color:var(--brand)}

/* ---------- templates ---------- */
.tpl{display:flex;flex-direction:column;gap:10px}
.tpl .text{color:var(--ink2);font-size:13px;line-height:1.6;white-space:pre-wrap;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tpl mark{background:var(--brand-soft);color:var(--brand-ink);border-radius:3px;padding:0 3px}
[data-theme="dark"] .tpl mark{color:var(--brand)}

/* ---------- toast / palette ---------- */
.toasts{position:fixed;right:20px;bottom:20px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{background:var(--surface);color:var(--ink);border:1px solid var(--line2);padding:10px 14px;border-radius:9px;box-shadow:var(--shadow-lg);font-size:13px;font-weight:500;animation:toastIn .25s var(--ease) both;display:flex;gap:8px;align-items:center}
.toast::before{content:"✓";color:var(--brand);font-weight:700}
.toast.err::before{content:"!";color:var(--red)}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}}
.palette{position:fixed;top:14vh;left:50%;transform:translateX(-50%) translateY(-6px);width:min(600px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow-lg);z-index:70;opacity:0;pointer-events:none;transition:all .18s var(--ease);overflow:hidden}
.palette.on{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.palette input{width:100%;border:0;outline:0;padding:14px 16px;font-size:15px;border-bottom:1px solid var(--line);background:transparent}
.palette .res{max-height:50vh;overflow:auto;padding:6px}
.palette .li{padding:8px 10px;border-top:0}
.palette .li.sel{background:var(--brand-tint)}

/* ---------- mobile ---------- */
.mtop,.mnav{display:none}
@media (max-width:1150px){.g2,.g3{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side,.topbar{display:none}
  .content{padding:14px 14px 100px}
  .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;padding:9px 14px;padding-top:max(9px,env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--line)}
  .mtop .ws{padding:0}
  .mtop .sp{margin-left:auto;display:flex;gap:6px}
  .mnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px max(6px,env(safe-area-inset-bottom))}
  .mnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:550;padding:5px 0;color:var(--muted)}
  .mnav a svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7}
  .mnav a.on{color:var(--brand)}
  .top{flex-direction:column;align-items:flex-start;margin-bottom:14px}
  .actions{width:100%}
  .search{flex:1}.search input{width:100%}
  .strip{grid-template-columns:1fr 1fr}
  .strip .kpi:nth-child(3){border-left:0}
  .strip .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .kpi .spark{display:none}
  .kpi .val{font-size:22px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .g2e{grid-template-columns:1fr}
  .fields{grid-template-columns:1fr}
  .fn{grid-template-columns:96px 1fr 30px 70px;gap:8px}
  .drawer{top:auto;left:0;right:0;bottom:0;width:100%;max-height:92vh;border-radius:14px 14px 0 0;border-left:0;transform:translateY(102%)}
  .drawer.on{transform:none}
  .hide-m{display:none}
  .board{grid-auto-columns:82%}
  .members{grid-template-columns:1fr}
  .toasts{left:14px;right:14px;bottom:80px;align-items:stretch}
}
.more-sheet .li{padding:12px 8px}
.more-sheet .li svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const num = v => { if (v === '' || v === null || v === undefined) return 0; const n = Number(String(v).replace(/[₹,\s]/g, '')); return isNaN(n) ? 0 : n; };

  if ((m = s.match(/^(\d{1,2})\s+([A-Za-z]{3})[a-z]*\s+(\d{2,4})/))) { const mo = MON[m[2].toLowerCase()]; if (mo !== undefined) return new Date(+m[3] < 100 ? 2000 + +m[3] : +m[3], mo, +m[1]); }
  return null;
}

const rel = v => { const d = pDate(v); if (!d) return ''; const n = days(today(), d); return n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : n === -1 ? 'Yesterday' : n < 0 ? `${-n}d overdue` : `in ${n}d`; };
const initials = s => String(s || '?').replace(/[^A-Za-zऀ-ॿ ]/g, ' ').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
const avatar = (s, lg) => { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; const [b, f] = AV_COLORS[h % AV_COLORS.length]; return `<div class="avatar ${lg ? 'lg' : ''}" style="background:${b};color:${f}">${esc(initials(s))}</div>`; };
const pill = (t, tone) => t ? `<span class="pill p-${tone || 'grey'}">${esc(t)}</span>` : '';

const balance = c => c['Balance (₹)'] !== '' && c['Balance (₹)'] !== undefined && c['Balance (₹)'] !== null ? num(c['Balance (₹)']) : (num(c['Quote (₹)']) ? num(c['Quote (₹)']) - num(c['Received (₹)']) : 0);
function pCalc(p) {
  const v = num(p['Project Value (₹)']), pct = num(p['Commission %']);
  const com = Math.round(v * pct / 100), pay = v - com, paid = num(p['Paid to Member (₹)']);

  ps.forEach(p => { const c = pCalc(p); s.value += c.value; s.com += c.com; s.pay += c.pay; s.paid += c.paid; s.bal += c.due; s.upcoming = (s.upcoming || 0) + (p['Status'] === 'Delivered' ? 0 : Math.max(0, c.bal)); s.hours += num(p['Hours']); const dl = pDate(p['Deadline']), dv = pDate(p['Delivered On']); if (dl && dv && dv > dl) s.late++; });

/* ---------- API ---------- */
async function api(body) {
  const { url, key } = cfg();
  const r = await fetch(url, { method: 'POST', body: JSON.stringify({ ...body, key }) });
  const j = await r.json(); if (j.error) throw new Error(j.error); return j;
}
async function load() {
  const { url, key } = cfg();
  if (!url || !key) { MODE = 'demo'; DB = demo(); return; }
  const j = await api({ action: 'read' });
  if (!j.tabs) throw new Error('Old Apps Script — paste the new Code.gs and redeploy');
  DB = { clients: j.tabs.clients || [], team: j.tabs.team || [], projects: j.tabs.projects || [], services: j.tabs.services || [], templates: j.tabs.templates || [] };
  MODE = 'live'; if (store.get('key', '')) store.set('cache', { DB, at: Date.now() }); store.set('sheetUrl', j.sheetUrl || '');
}
function setSync(state, text) {
  ['syncDot', 'syncDotM'].forEach(id => { const el = document.getElementById(id); if (el) el.className = 'dot ' + state; });
  $('#syncText').textContent = text;
}
async function refresh(manual) {
  setSync('busy', 'Syncing…');
  try {
    await load();
    setSync(MODE === 'live' ? 'ok' : 'demo', MODE === 'live' ? 'Synced ' + new Date().toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }) : 'Demo data');
    if (manual && MODE === 'live') toast('Up to date with your sheet');
  } catch (e) {
    const c = store.get('cache', null); if (c && c.DB) { DB = c.DB; MODE = 'live'; }
    setSync('err', /key|Locked/i.test(e.message) ? e.message.split(':')[0] : 'Offline · cached');
    if (manual) toast(e.message === 'Wrong key' ? 'Wrong secret key — check Settings' : /Locked|SECRET_KEY/.test(e.message) ? e.message : 'Could not reach the sheet: ' + e.message, true);
  }
  render();
}
async function save(tab, rec, fields, isNew) {
  if (MODE === 'demo') {
    if (isNew) { rec._row = Date.now(); Object.assign(rec, fields); DB[tab].push(rec); } else Object.assign(rec, fields);
    toast(isNew ? 'Added (demo — connect your sheet to keep it)' : 'Saved (demo)'); render(); return true;
  }
  const backup = { ...rec }; Object.assign(rec, fields); if (isNew) DB[tab].push(rec); render();
  setSync('busy', 'Saving…');
  try {
    const r = await api(isNew ? { action: 'add', tab, fields } : { action: 'update', tab, row: rec._row, fields });
    if (isNew) rec._row = r.row;
    toast(isNew ? 'Added to your sheet' : 'Saved to your sheet');
    refresh(); return true;
  } catch (e) {
    if (isNew) DB[tab] = DB[tab].filter(x => x !== rec); else Object.assign(rec, backup);
    render(); setSync('err', 'Save failed'); toast('Save failed: ' + e.message, true); return false;
  }
}
async function remove(tab, rec) {
  if (!confirm('Delete this row from your sheet? This clears it and cannot be undone here.')) return;

  if (MODE === 'demo') return toast('Deleted (demo)');

}

/* ---------- view parts ---------- */
function kpi(label, val, foot, color, series) { return `<div class="kpi card"><div class="label"><i style="background:${color};color:${color}"></i>${label}</div>${series ? spark(series, 'var(--brand)') : ''}<div class="val" data-count>${val}</div><div class="foot">${foot}</div></div>`; }
function spark(v, color) { const max = Math.max(1, ...v), min = Math.min(0, ...v), w = 84, h = 34, pts = v.map((y, i) => [i / (v.length - 1) * w, h - 3 - (y - min) / (max - min || 1) * (h - 6)]); const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' '); const id = 'g' + Math.random().toString(36).slice(2, 7); return `<svg class="spark" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${color};stop-opacity:.35"/><stop offset="1" style="stop-color:${color};stop-opacity:0"/></linearGradient></defs><path d="${d} L${w} ${h} L0 ${h}Z" fill="url(#${id})"/><path d="${d}" fill="none" style="stroke:${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${pts[pts.length - 1][0]}" cy="${pts[pts.length - 1][1]}" r="2.6" style="fill:${color}"/></svg>`; }
function countUp() { document.querySelectorAll('[data-count]').forEach(el => { const txt = el.textContent, m = txt.match(/^(\D*)([\d,]+(?:\.\d+)?)(.*)$/); if (!m) return; const target = parseFloat(m[2].replace(/,/g, '')), dec = (m[2].split('.')[1] || '').length, t0 = performance.now(), dur = 900; const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3), v = target * e; el.textContent = m[1] + (dec ? v.toFixed(dec) : Math.round(v).toLocaleString('en-IN')) + m[3]; if (k < 1) requestAnimationFrame(step); else el.textContent = txt; }; requestAnimationFrame(step); }); }
function empty(t, s) { return `<div class="empty"><span class="serif">${t}</span>${s}</div>`; }
function clientList(arr, right, et, es) { return arr.length ? `<div class="list">${arr.map(c => `<div class="li" onclick="openClient(${c._row})">${avatar(cName(c))}<div class="grow"><div class="t">${esc(cName(c))}</div><div class="s">${esc(c['Next Action'] || c['Service Needed'] || '')}</div></div>${right(c)}</div>`).join('')}</div>` : empty(et, es); }
function memberCard(m) {
  const s = memberStats(m['Name']), r = num(m['Rating']);
  const skills = String(m['Skills / Tools'] || '').split(/[,/|]/).map(x => x.trim()).filter(Boolean).slice(0, 5);

$('#palIn').addEventListener('keydown', e => { if (e.key === 'ArrowDown') { PSEL = Math.min(PAL.length - 1, PSEL + 1); palDraw(); e.preventDefault(); } if (e.key === 'ArrowUp') { PSEL = Math.max(0, PSEL - 1); palDraw(); e.preventDefault(); } if (e.key === 'Enter') palGo(PSEL); });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); }
  if (e.key === 'Escape') closeAll();
  if (e.key.toLowerCase() === 'n' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !$('#drawer').classList.contains('on') && !e.ctrlKey && !e.metaKey) newClient();
});
